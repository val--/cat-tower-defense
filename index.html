<title>La Maison de Michka</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  /* Single-theme by design: the game world is a sunny backyard in either host theme.
     The interface borrows the 3D scene's look: cream paper, the same ink outline as the
     cel-shaded models, and flat offset shadows, like stickers stuck on the garden. */
  :root {
    color-scheme: light;
    --ink: #2B2536;
    --ink-soft: #6E6379;
    --paper: #FFF6E6;
    --paper-2: #F5E6CA;
    --marigold: #F2A541;
    --marigold-hi: #F7BD66;
    --brick: #C8553D;
    --heart: #E86A6A;
    --leaf: #7BD389;
    --yard: #8DB36B;
    --dirt: #E6C48C;
    --line: 2.5px solid var(--ink);
    --lift: 3px 3px 0 var(--ink);
    --display: Gluten, "Comic Sans MS", cursive;
  }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .hud, .dock { transition: opacity .3s, visibility .3s; }
  body:has(#overlay:not([hidden])) :is(.hud, .dock) { opacity: 0; visibility: hidden; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--yard); color: var(--ink);
    font: 700 14px/1.4 Nunito, "Trebuchet MS", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  svg { display: block; }

  /* ---- shared pieces ---- */
  .sticker { background: var(--paper); border: var(--line); border-radius: 14px; box-shadow: var(--lift); }
  button {
    font: inherit; font-weight: 800; color: var(--ink); cursor: pointer;
    border: var(--line); border-radius: 12px; padding: 7px 13px;
    background: var(--paper); box-shadow: var(--lift);
    transition: transform .07s, box-shadow .07s, background-color .15s;
  }
  button:hover { background: #FFFBF3; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { color: #9C93A6; border-color: #9C93A6; box-shadow: 3px 3px 0 #9C93A6; background: #EFE6D6; cursor: default; transform: none; }
  button:focus-visible, .card:focus-visible, summary:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button.go { background: var(--marigold); }
  button.go:hover { background: var(--marigold-hi); }
  button.round { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  button.round svg { width: 18px; height: 18px; }
  .kbd {
    display: inline-block; min-width: 1.5em; padding: 0 5px; text-align: center;
    font: 800 11px/19px Nunito, sans-serif; color: var(--ink);
    background: #fff; border: 1.5px solid var(--ink); border-radius: 5px; box-shadow: 0 2px 0 var(--ink);
  }
  .lang { display: flex; gap: 2px; font-size: 12px; }
  .lang button { border: 0; box-shadow: none; background: none; padding: 3px 6px; color: var(--ink-soft); border-radius: 6px; }
  .lang button:active { transform: none; }
  .lang button.on { color: var(--ink); background: var(--paper-2); }

  /* ---- HUD ---- */
  .hud {
    position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stat { display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 9px; }
  .stat .num { font: 800 21px/1 var(--display); font-variant-numeric: tabular-nums; padding-top: 3px; }
  .stat .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 800; }
  .hearts { display: flex; gap: 1px; }
  .hearts svg { width: 17px; height: 17px; }
  .hearts .lost path { fill: var(--paper-2); }
  .stat.hurt { animation: hurt .45s; }
  @keyframes hurt { 25% { transform: translateX(-4px) rotate(-2deg); background: #FFD9CF; } 60% { transform: translateX(3px) rotate(1deg); } }
  .stat.gain { animation: gain .25s; }
  @keyframes gain { 45% { transform: scale(1.08) rotate(-2deg); } }
  #fishStat svg { width: 24px; height: 24px; }
  .track { display: flex; gap: 3px; margin-left: 2px; }
  .track i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; }
  .track i.done { background: var(--leaf); }
  .track i.now { background: var(--marigold); }
  .next { gap: 8px; font-size: 13px; }
  .next .chip { display: flex; align-items: center; gap: 2px; font-weight: 900; }
  .next .chip svg { width: 22px; height: 22px; }

  .corner { display: flex; gap: 8px; align-items: center; }
  #camBtn { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px 0 10px; border-radius: 20px; }
  #camBtn svg { width: 18px; height: 18px; }
  #speedBtn { font: 800 16px/1 var(--display); padding-top: 3px; }

  /* ---- bottom dock: cat tray + wave button ---- */
  .dock {
    position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; justify-content: center; align-items: flex-end; gap: 12px; pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .tray { display: flex; gap: 6px; padding: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; border-radius: 18px; }
  .card {
    flex: none; display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-items: center; position: relative;
    min-width: 118px; padding: 7px 12px 7px 8px; border-radius: 12px; text-align: left;
    border: 2px solid transparent; box-shadow: none; background: transparent;
  }
  .card:hover { background: var(--paper-2); }
  .card:active { transform: none; box-shadow: none; }
  .card.on { background: var(--marigold); border-color: var(--ink); }
  .card.poor { opacity: .42; }
  .card .name { font: 700 16px/1 var(--display); padding-top: 3px; }
  .card .meta { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 900; }
  .card .meta svg { width: 15px; height: 15px; }
  .card .role { display: block; grid-column: 2; font-size: 10.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.15; }
  .card.on .role { color: var(--ink); }
  .card .kbd { position: absolute; top: -7px; right: -4px; font-size: 10px; line-height: 15px; min-width: 15px; padding: 0 3px; }
  /* a little CSS cat head per breed, inked like the 3D models */
  .face { grid-row: span 3; width: 28px; height: 23px; border-radius: 50%; background: var(--c); position: relative; margin-top: 7px; border: 2px solid var(--ink); }
  .face::before, .face::after {
    content: ""; position: absolute; top: -9px; width: 12px; height: 12px; background: var(--ink);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .face::before { left: 0; transform: rotate(-16deg); }
  .face::after { right: 0; transform: rotate(16deg); }
  .face i::before, .face i::after {
    content: ""; position: absolute; top: -5px; width: 7px; height: 7px; background: var(--e, var(--c)); z-index: 1;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .face i::before { left: 2.5px; transform: rotate(-16deg); }
  .face i::after { right: 2.5px; transform: rotate(16deg); }
  #waveBtn { font: 700 18px/1 var(--display); padding: 14px 18px 11px; border-radius: 16px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  #waveBtn svg { width: 20px; height: 20px; margin-top: -3px; }
  #waveBtn small { font: 800 12px Nunito, sans-serif; }

  /* ---- selected cat ---- */
  .info {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
    width: min(370px, calc(100% - 24px)); box-sizing: border-box;
    padding: 12px 14px 14px; border-radius: 18px; display: grid; gap: 10px;
  }
  .info header { display: flex; align-items: baseline; gap: 10px; padding-right: 30px; }
  .info h3 { margin: 0; font: 700 24px/1 var(--display); }
  .info .lvl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; color: var(--ink-soft); }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; }
  .pips i.l2 { background: #C9D3E1; }
  .pips i.l3 { background: #FFD54F; }
  #closeBtn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; box-shadow: none; border-width: 2px; }
  #closeBtn:active { transform: none; }
  .info .row { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
  .info .row > div { background: var(--paper-2); border-radius: 9px; padding: 4px 9px; font-size: 11px; color: var(--ink-soft); }
  .info .row b { display: block; color: var(--ink); font-size: 14px; }
  .info .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .info .btns button { font-size: 13px; }

  /* ---- messages ---- */
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translate(-50%, -10px) rotate(-1deg);
    font-weight: 900; padding: 8px 16px; border-radius: 12px; max-width: min(440px, calc(100% - 32px)); box-sizing: border-box;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }
  .coin {
    position: fixed; z-index: 5; margin: -13px 0 0 -16px; pointer-events: none;
    display: flex; align-items: center; gap: 1px;
    font: 800 15px/1 var(--display); color: var(--ink);
    text-shadow: 1.5px 0 0 var(--paper), -1.5px 0 0 var(--paper), 0 1.5px 0 var(--paper), 0 -1.5px 0 var(--paper);
    transition: transform .6s cubic-bezier(.55, -0.45, .75, .9), opacity .6s ease-in;
    animation: coinPop .18s ease-out;
  }
  .coin svg { width: 22px; height: 22px; }
  @keyframes coinPop { from { scale: .3; } }
  .paused {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg);
    padding: 14px 26px 16px; border-radius: 20px; text-align: center; display: grid; gap: 6px; justify-items: center;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .paused b { font: 800 44px/1 var(--display); padding-top: 6px; }
  .paused p { margin: 0; font-size: 13px; color: var(--ink-soft); }

  /* ---- title / result screen: a storybook cover on the left, the garden turning behind it ---- */
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; padding: 20px max(20px, 6vw); box-sizing: border-box;
    background: linear-gradient(90deg, rgba(43, 37, 54, .5), rgba(43, 37, 54, .12) 55%, rgba(43, 37, 54, 0));
    overflow-y: auto;
  }
  .sheet {
    position: relative; width: min(440px, 100%); box-sizing: border-box; margin: auto 0;
    padding: 26px 26px 22px; border: 3px solid var(--ink); border-radius: 24px; box-shadow: 7px 7px 0 var(--ink);
    display: grid; gap: 14px; transform: rotate(-.8deg);
  }
  .sheet .lang { position: absolute; top: 14px; right: 14px; }
  .sheet h1 { margin: 4px 0 0; font: 800 clamp(40px, 7vw, 58px)/.9 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .sheet h1 em { font-style: normal; color: var(--marigold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .sheet .tag { margin: -6px 0 0; font: 500 17px/1.2 var(--display); color: var(--brick); }
  .sheet p { margin: 0; }
  #ovText { font-weight: 700; color: #4A4155; }
  .stars { display: flex; gap: 6px; }
  .stars svg { width: 44px; height: 44px; }
  .stars.small { gap: 1px; }
  .stars.small svg { width: 15px; height: 15px; }
  .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .map-card { display: grid; gap: 6px; padding: 8px 8px 7px; border-radius: 14px; text-align: left; font-weight: 800; }
  .map-card svg.thumb { width: 100%; height: auto; border-radius: 7px; border: 2px solid var(--ink); box-sizing: border-box; }
  .map-card .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 4px; font-size: 13px; }
  .map-card.on { background: var(--marigold); }
  .map-card.on .stars path[fill="#F2A541"] { fill: var(--ink); } /* earned stars would vanish on the marigold card */
  .map-card:not(.on) { box-shadow: 2px 2px 0 var(--ink); }
  .map-card .none { font-size: 11px; color: var(--ink-soft); }
  .map-card.on .none { color: var(--ink); }
  #ovBtn { font: 700 22px/1 var(--display); padding: 15px 22px 12px; border-radius: 16px; justify-self: start; display: flex; gap: 10px; align-items: center; }
  #ovBtn svg { width: 22px; height: 22px; margin-top: -3px; }
  details { border-top: 2px dashed #D8C7A8; padding-top: 10px; }
  summary { cursor: pointer; font-weight: 900; list-style: none; display: flex; gap: 6px; align-items: center; width: fit-content; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 50%; font-size: 13px; line-height: 1; }
  details[open] summary::before { content: "–"; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 10px 0 0; font-size: 12.5px; align-items: center; }
  .keys dt { display: flex; gap: 3px; justify-self: end; }
  .keys dd { margin: 0; color: #4A4155; }
  .keys .mouse { grid-column: 1 / -1; color: var(--ink-soft); margin-top: 2px; }

  @media (max-width: 600px) {
    .hud { flex-direction: column-reverse; align-items: stretch; }
    .corner { justify-content: flex-end; }
    #camBtn span { display: none; }
    #camBtn { width: 40px; padding: 0; justify-content: center; }
    .stat { padding: 4px 9px 4px 7px; }
    .stat .num { font-size: 18px; }
    .hearts svg { width: 13px; height: 13px; }
    .stat .lbl, .track { display: none; }
    .dock { flex-direction: column; align-items: stretch; gap: 8px; }
    #waveBtn { align-self: flex-end; font-size: 16px; padding: 11px 14px 9px; }
    .card { min-width: 0; padding: 6px 9px 6px 7px; }
    .card .role, .card .kbd { display: none; }
    .info { bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
    .overlay { background: rgba(43, 37, 54, .35); padding: 16px; justify-content: center; }
    .sheet { transform: none; padding: 22px 18px 18px; box-shadow: 5px 5px 0 var(--ink); }
  }
  @media (max-height: 820px) and (min-width: 601px) {
    .sheet { gap: 11px; padding: 20px 24px 18px; }
    .sheet h1 { font-size: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="stage"></div>

<div class="hud">
  <div class="stats">
    <div class="sticker stat" id="livesStat" data-i18n-title="livesTip">
      <div class="hearts" id="hearts"></div><span class="sr"><span id="lives">9</span> <span data-i18n="lives"></span></span>
    </div>
    <div class="sticker stat" id="fishStat" data-i18n-title="fishTip">
      <span class="ico-fish"></span><span class="num" id="fish">0</span>
    </div>
    <div class="sticker stat">
      <span class="lbl" data-i18n="wave"></span><span class="num" id="wave">0/10</span><div class="track" id="track"></div>
    </div>
    <div class="sticker stat next" id="nextStat" data-i18n-title="nextTip"><span class="lbl" data-i18n="next"></span><div id="nextList" style="display:flex;gap:8px"></div></div>
  </div>
  <div class="corner">
    <button id="camBtn" data-i18n-title="camTip"><span class="ico-cam"></span><span id="camLbl"></span></button>
    <button class="round" id="muteBtn" data-i18n-title="muteTip"></button>
    <button class="round" id="pauseBtn" data-i18n-title="pauseTip"></button>
    <button class="round" id="speedBtn" data-i18n-title="speedTip">1×</button>
  </div>
</div>

<div class="sticker info" id="info" hidden>
  <header><h3 id="infoName"></h3><span class="lvl" id="infoLvl"></span></header>
  <button id="closeBtn" class="round" data-i18n-title="close" aria-label="×">×</button>
  <div class="row">
    <div><span data-i18n="damage"></span><b id="infoDmg">0</b></div>
    <div><span data-i18n="range"></span><b id="infoRng">0</b></div>
    <div><span data-i18n="rate"></span><b id="infoRate">0</b></div>
    <div id="infoExtraWrap"><span id="infoExtraLbl"></span><b id="infoExtra"></b></div>
  </div>
  <div class="btns">
    <button class="go" id="upBtn"></button>
    <button id="modeBtn" data-i18n-title="modeTip"></button>
    <button id="sellBtn"></button>
  </div>
</div>

<div class="dock">
  <div class="sticker tray" id="tray"></div>
  <button class="go" id="waveBtn"></button>
</div>
<div class="sticker toast" id="toast"></div>
<div class="sticker paused" id="pausedTag" hidden>
  <b data-i18n="paused"></b>
  <p data-i18n-html="resume"></p>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button data-lang="fr" title="Français">FR</button>
    <button data-lang="en" title="English">EN</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sticker sheet">
    <div class="lang" role="group" aria-label="Langue / Language">
      <button data-lang="fr" title="Français">FR</button>
      <button data-lang="en" title="English">EN</button>
    </div>
    <h1 id="ovTitle"></h1>
    <p class="tag" id="ovTag"></p>
    <div class="stars" id="ovStars" hidden></div>
    <p id="ovText"></p>
    <div class="maps" id="mapPick" role="group" data-i18n-aria="mapLbl"></div>
    <button class="go" id="ovBtn"></button>
    <details id="ovHow">
      <summary data-i18n="howTitle"></summary>
      <dl class="keys" id="keys"></dl>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- Config ----------
  const COLS = 16, ROWS = 10, MAX_WAVE = 10;
  const ATK_TIME = 0.3, HIT_AT = 0.5, DROP_TIME = 0.55, DEATH_TIME = 0.4;
  // Maps: path waypoints in grid coords (col, row), from off-map to the house door, plus decorative bushes.
  // The house always sits on columns 14–15, rows 4–6, with its door facing the path's last tile.
  const MAPS = {
    garden:  { hp: 1,    path: [[-1, 2], [4, 2], [4, 7], [9, 7], [9, 2], [13, 2], [13, 5], [14, 5]],
               bushes: [[0, 0], [2, 8], [7, 0], [6, 4], [11, 9], [15, 1], [15, 8], [11, 4]] },
    // Longer and twistier, which gives cats more time; with the steep late HP curve it plays about as hard as the Garden
    potager: { hp: 1,    path: [[1, -1], [1, 7], [5, 7], [5, 1], [9, 1], [9, 8], [12, 8], [12, 5], [14, 5]],
               bushes: [[3, 3], [7, 4], [7, 9], [0, 9], [11, 0], [15, 1], [15, 8], [10, 5], [3, 0]] },
  };
  // ---------- Difficulty (a single mode; every economy knob lives here) ----------
  const START_LIVES = 9, START_FISH = 130;
  // Enemy HP multiplier per wave: gentle through wave 5, then climbing much faster so waves 6–10 still test
  // a full garden of upgraded cats
  const hpGrowth = w => 1 + 0.15 * (w - 1) + 0.03 * (w - 1) ** 2 + 0.35 * Math.max(0, w - 5) ** 2;
  const HP_EXTRA = 1.08;                            // extra toughness on top, times the map's own factor…
  // …ramped in over waves 1–5, so the opening isn't lost before the first cats are up
  const hpBonus = (m, w) => m <= 1 ? m : 1 + (m - 1) * Math.min(1, (w - 1) / 4);
  const rewardMul = w => 1 + 0.03 * (w - 1);       // kill rewards grow a little with the wave
  const clearBonus = w => 15 + 3 * w;               // paid when the last invader of wave w is gone
  const earlyBonus = w => 10 + 2 * w;               // for calling wave w while the previous one is still on the path
  const HOUSE_TILES = []; for (let c = 14; c <= 15; c++) for (let r = 4; r <= 6; r++) HOUSE_TILES.push([c, r]);

  const TYPES = {
    // Kitten is melee: range 1.5 reaches the path tiles touching its own tile, diagonals included. It can't reach fliers.
    kitten:  { key: '1', cost: 40,  range: 1.5, rate: 0.45, dmg: 9,  color: 0xF2A541, pts: 0xD9822B, bib: 0xFFF1DC, eye: 0x9BD35A, cushion: 0xE8D5B5, size: 0.85, melee: true, meow: 1.35 },
    tabby:   { key: '2', cost: 70,  range: 3.3, rate: 0.9,  dmg: 22, color: 0x9A7B5E, pts: 0x5E4634, bib: 0xE9DCC8, eye: 0xE8B33A, cushion: 0x6B8FB3, proj: 0xDDEBF5, pspeed: 13, size: 1.0, marks: 'stripes', meow: 1 },

  // ---------- Models ----------
  function makeCat(T) {
    const g = new THREE.Group();
    const fur = lambert(T.color), pts = lambert(T.pts), dark = lambert(0x221C26);
    if (T.cushion) g.add(mesh(cyl(0.4, 0.43, 0.12, 20), lambert(T.cushion), { p: [0, 0.06, 0] }));
    // rig: g (placement) > body (size, squash, lunge) > torso, haunches, arm pivots, head group, tail chain.
    // A sitting cat: +z is forward, front legs straight down from the shoulders.
    const body = new THREE.Group(); body.position.y = 0.12; body.scale.setScalar(T.size); g.add(body);
    const bib = T.bib ? lambert(T.bib) : fur;
    const pawMat = T.marks === 'mask' ? pts : T.bib ? bib : pts;
    const torso = mesh(SPH, fur, { p: [0, 0.25, -0.03], s: [0.24, 0.3, 0.26], r: [-0.18, 0, 0] });
    body.add(torso);
    if (T.bib) body.add(mesh(SPH, bib, { p: [0, 0.3, 0.12], s: [0.15, 0.21, 0.12], r: [-0.18, 0, 0] }));
    [-1, 1].forEach(s => {
      body.add(mesh(SPH, fur, { p: [0.14 * s, 0.12, -0.08], s: [0.11, 0.13, 0.17] }));  // haunch
      body.add(mesh(SPH, pawMat, { p: [0.15 * s, 0.025, 0.08], s: [0.055, 0.035, 0.09] })); // hind foot
    });
    // front legs on shoulder pivots: rotation.x < 0 swings the paw forward and up
    const legGeo = geo('catLeg', () => new THREE.CylinderGeometry(0.042, 0.048, 0.3, 8).translate(0, -0.15, 0));
    const arms = [], paws = [];
    [-1, 1].forEach(s => {
      const arm = new THREE.Group(); arm.position.set(0.085 * s, 0.36, 0.13);
      arm.add(mesh(legGeo, T.marks === 'mask' ? pts : fur));
      const paw = mesh(SPH, pawMat, { p: [0, -0.325, 0.025], s: [0.062, 0.045, 0.075] });
      arm.add(paw); body.add(arm); arms.push(arm); paws.push(paw);
    });
    // head
    const head = new THREE.Group(); head.position.set(0, 0.62, 0.07); body.add(head);
    head.add(mesh(SPH, fur, { s: [0.22, 0.2, 0.2] }));
    const cheek = T.marks === 'fluff' ? 1.35 : 1;
    [-1, 1].forEach(s => head.add(mesh(SPH, fur, { p: [0.1 * s * cheek, -0.07, 0.06], s: [0.1 * cheek, 0.085 * cheek, 0.1] }))); // cheek fluff
    if (T.marks === 'fluff') body.add(mesh(SPH, bib, { p: [0, 0.45, 0.06], s: [0.27, 0.17, 0.22] }));              // Persian ruff
    const muzzleMat = T.marks === 'mask' ? pts : T.bib ? bib : lambert(0xFFF4E2);
    [-1, 1].forEach(s => head.add(mesh(SPH, muzzleMat, { p: [0.037 * s, -0.075, 0.16], s: [0.05, 0.04, 0.04] })));
    head.add(mesh(SPH, muzzleMat, { p: [0, -0.11, 0.14], s: [0.04, 0.03, 0.035] }));                      // chin
    head.add(mesh(cone(0.024, 0.025, 3), toon(0xE86A92), { p: [0, -0.045, 0.197], r: [Math.PI, 0, 0] })); // nose
    const whiskerMat = basic(T.color < 0x606060 ? 0xF4EFE6 : 0x4A4250);
    const whiskerGeo = geo('whisker', () => new THREE.BoxGeometry(0.17, 0.005, 0.005).translate(0.085, 0, 0));
    [-1, 1].forEach(s => [-1, 0, 1].forEach(i => {
      const w = new THREE.Mesh(whiskerGeo, whiskerMat); w.userData.noInk = true;
      w.position.set(0.06 * s, -0.07 + i * 0.012, 0.17);
      w.rotation.set(0, s > 0 ? -0.35 : Math.PI + 0.35, i * 0.14 * s);
      head.add(w);
    }));
    const earGeo = cone(0.075, 0.17, 4), innerEar = toon(0xE8A0B0);
    const ears = [-1, 1].map(s => {
      const e = new THREE.Group(); e.position.set(0.11 * s, 0.15, -0.01); e.rotation.z = -0.3 * s;
      e.add(mesh(earGeo, pts, { p: [0, 0.06, 0] }), mesh(earGeo, innerEar, { p: [0, 0.05, 0.03], s: [0.6, 0.7, 0.4] }));
      if (T.marks === 'torn' && s > 0) e.scale.set(1, 0.72, 1);   // Big Tom lost a fight once
      head.add(e); return e;
    });
    if (T.marks === 'stripes') [-1, 0, 1].forEach(i => head.add(mesh(SPH, pts, { p: [i * 0.05, 0.13, 0.13], s: [0.014, 0.05, 0.02], r: [0.5, 0, -i * 0.3] })));
    if (T.marks === 'torn') head.add(mesh(new THREE.BoxGeometry(0.012, 0.09, 0.01), lambert(0xE8A0B0), { p: [-0.09, 0.07, 0.17], r: [0.2, 0.3, 0.4] })); // scar
    const white = new THREE.MeshBasicMaterial({ color: 0xffffff }), iris = lambert(T.eye);
    const eyes = [-1, 1].map(s => {
      const eye = new THREE.Group(); eye.position.set(0.08 * s, 0.03, 0.163); eye.rotation.y = 0.28 * s;
      eye.add(mesh(SPH, iris, { s: [0.046, 0.054, 0.03] }), mesh(SPH, dark, { p: [0, 0, 0.016], s: [0.016, 0.042, 0.02] }), mesh(SPH, white, { p: [0.014, 0.02, 0.028], s: 0.012 }));
      head.add(eye); return eye;
    });
    // tail: a chain of tapering segments that curls up behind; wagged as a travelling wave
    const tail = [], ringed = T.marks === 'stripes';

    for (let i = 0; i < 6; i++) {
      const seg = new THREE.Group();
      if (i === 0) seg.position.set(0, 0.08, -0.28); else seg.position.y = 0.085;
      seg.rotation.x = i === 0 ? -1.45 : 0.32;
      const r0 = (0.045 - i * 0.004) * (T.marks === 'fluff' ? 1.6 : 1);
      const segGeo = geo('tail' + r0, () => new THREE.CylinderGeometry(r0 - 0.004, r0, 0.1, 7).translate(0, 0.045, 0));

    const rank = {};
    if (T.cushion) {
      rank.rim = mesh(torus(0.43, 0.04, 8, 40), toon(0xDCE3EC), { p: [0, 0.125, 0], r: [Math.PI / 2, 0, 0] });
      rank.rim.add(rank.rimInk = new THREE.Mesh(torus(0.43, 0.058, 8, 40), inkMat)); // ink outline, like the models
      g.add(rank.rim);

    rank.collar = mesh(torus(0.14, 0.03, 8, 24), toon(0xC8553D), { p: [0, 0.49, 0.05], r: [Math.PI / 2 + 0.35, 0, 0] });
    rank.bell = mesh(SPH, toon(0xDCE3EC), { p: [0, 0.43, 0.23], s: 0.055 });
    body.add(rank.collar, rank.bell);
    shadows(g); outline(g);
    [rank.rim, rank.collar, rank.bell].forEach(m => { if (m) m.visible = false; }); // the ring's ink child follows its parent
    return { g, body, torso, head, ears, eyes, tail, arms, paws, rank };
  }

  // Enemy rig: g (path position + heading + size) > inner (bob, lean, squash) > parts; legs, wings and tail on pivots.
  // Every invader gets its own materials so its hit flash doesn't light up the others.
  const UP = new THREE.Vector3(0, 1, 0);
  function makeEnemy(kind) {
    const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
    const dark = lambert(0x221C26), pink = lambert(0xE8A0B0);
    const legs = [], wings = [], tail = new THREE.Group();

      pivot.add(mesh(SPH, footMat, { p: [0, -len, 0.02], s: [r * 1.3, r * 0.9, r * 1.6] }));
      inner.add(pivot);
      legs.push({ pivot, phase: (i === 0 || i === 3) ? 0 : Math.PI }); // diagonal pairs move together
    });
    const eyes = (x, y, z, s) => inner.add(mesh(SPH, dark, { p: [-x, y, z], s }), mesh(SPH, dark, { p: [x, y, z], s }));
    if (kind === 'mouse') {
      const fur = lambert(0xA7A0AE);
      inner.add(mesh(SPH, fur, { p: [0, 0.2, 0], s: [0.2, 0.18, 0.3] }), mesh(SPH, fur, { p: [0, 0.25, 0.28], s: 0.14 }));
      inner.add(mesh(SPH, pink, { p: [-0.1, 0.38, 0.24], s: [0.08, 0.08, 0.02] }), mesh(SPH, pink, { p: [0.1, 0.38, 0.24], s: [0.08, 0.08, 0.02] }));
      inner.add(mesh(SPH, pink, { p: [0, 0.24, 0.43], s: 0.03 }));
      eyes(0.06, 0.29, 0.39, 0.026);
      addLegs([[-0.1, 0.14], [0.1, 0.14], [-0.1, -0.14], [0.1, -0.14]], 0.1, 0.07, 0.03, fur, pink);
      tail.position.set(0, 0.16, -0.28);

    } else if (kind === 'raccoon') {

      inner.add(mesh(SPH, light, { p: [0, 0.38, 0.52], s: [0.1, 0.08, 0.09] }), mesh(SPH, dark, { p: [0, 0.39, 0.61], s: 0.035 }));
      inner.add(mesh(SPH, dark, { p: [0, 0.48, 0.47], s: [0.2, 0.06, 0.1] }));

      inner.add(mesh(cone(0.06, 0.12, 5), dark, { p: [-0.13, 0.64, 0.32] }), mesh(cone(0.06, 0.12, 5), dark, { p: [0.13, 0.64, 0.32] }));
      addLegs([[-0.15, 0.2], [0.15, 0.2], [-0.15, -0.2], [0.15, -0.2]], 0.2, 0.16, 0.045, fur, dark);

      // upright little body, tufted ears, and a big bushy tail curling up over its back

      inner.add(mesh(SPH, fur, { p: [0, 0.26, 0], s: [0.17, 0.2, 0.24], r: [-0.4, 0, 0] }), mesh(SPH, belly, { p: [0, 0.25, 0.1], s: [0.12, 0.15, 0.1], r: [-0.4, 0, 0] }));
      inner.add(mesh(SPH, fur, { p: [0, 0.42, 0.2], s: 0.13 }), mesh(SPH, belly, { p: [0, 0.38, 0.29], s: [0.07, 0.06, 0.06] }), mesh(SPH, dark, { p: [0, 0.41, 0.335], s: 0.022 }));
      eyes(0.065, 0.46, 0.29, 0.028);
      inner.add(mesh(cone(0.035, 0.1, 5), fur, { p: [-0.07, 0.57, 0.17], r: [0, 0, 0.2] }), mesh(cone(0.035, 0.1, 5), fur, { p: [0.07, 0.57, 0.17], r: [0, 0, -0.2] }));
      addLegs([[-0.08, 0.12], [0.08, 0.12], [-0.1, -0.1], [0.1, -0.1]], 0.12, 0.09, 0.03, fur, belly);
      tail.position.set(0, 0.22, -0.2);
      [[0, 0.04, -0.08, 0.1], [0, 0.19, -0.16, 0.13], [0, 0.37, -0.12, 0.14], [0, 0.5, -0.01, 0.11]]
        .forEach(([x, y, z, s]) => tail.add(mesh(SPH, fur, { p: [x, y, z], s })));
    } else if (kind === 'hedgehog') {
      // a dome of spines over a pale snout
      const skin = lambert(0x9C7B5B), spine = lambert(0x5E4634), pale = lambert(0xE9D5B5);
      const R = [0.26, 0.2, 0.3], c = new THREE.Vector3(0, 0.2, -0.02);
      inner.add(mesh(SPH, skin, { p: [c.x, c.y, c.z], s: R }));
      inner.add(mesh(SPH, pale, { p: [0, 0.17, 0.28], s: [0.11, 0.09, 0.14] }), mesh(SPH, dark, { p: [0, 0.18, 0.42], s: 0.032 }));

    } else if (kind === 'pigeon') {

      inner.add(mesh(SPH, fur, { p: [0, 0.2, 0], s: [0.16, 0.15, 0.24] }), mesh(SPH, neck, { p: [0, 0.27, 0.14], s: [0.11, 0.09, 0.1] }));
      inner.add(mesh(SPH, fur, { p: [0, 0.35, 0.2], s: 0.1 }), mesh(cone(0.025, 0.07, 5), lambert(0xE8B33A), { p: [0, 0.34, 0.32], r: [Math.PI / 2, 0, 0] }));
      eyes(0.055, 0.38, 0.27, 0.02);

        pivot.add(mesh(SPH, wing, { p: [0.17 * s, 0, -0.02], s: [0.2, 0.03, 0.13] }));
        inner.add(pivot); wings.push({ pivot, side: s });
      });
      tail.position.set(0, 0.2, -0.22);
      tail.add(mesh(box(0.16, 0.02, 0.18), wing, { p: [0, 0, -0.07], r: [0.25, 0, 0] }));
    } else if (kind === 'boss') {

      inner.add(mesh(SPH, fur, { p: [0, 0.52, 0.38], s: [0.26, 0.2, 0.2] }), mesh(SPH, white, { p: [0, 0.45, 0.54], s: [0.16, 0.1, 0.08] }));
      inner.add(mesh(SPH, fur, { p: [-0.13, 0.44, 0.5], s: 0.09 }), mesh(SPH, fur, { p: [0.13, 0.44, 0.5], s: 0.09 }));  // jowls
      inner.add(mesh(SPH, dark, { p: [0, 0.51, 0.62], s: [0.05, 0.035, 0.03] }));
      inner.add(mesh(cone(0.018, 0.05, 4), white, { p: [-0.06, 0.45, 0.61] }), mesh(cone(0.018, 0.05, 4), white, { p: [0.06, 0.45, 0.61] })); // underbite
      eyes(0.1, 0.58, 0.53, 0.03);
      const earMat = lambert(0x9C7450);
      inner.add(mesh(SPH, earMat, { p: [-0.21, 0.62, 0.36], s: [0.05, 0.08, 0.07], r: [0, 0, 0.6] }), mesh(SPH, earMat, { p: [0.21, 0.62, 0.36], s: [0.05, 0.08, 0.07], r: [0, 0, -0.6] }));
      const crown = new THREE.Group(); crown.position.set(0, 0.73, 0.36); crown.rotation.x = -0.15;
      crown.add(mesh(cyl(0.1, 0.11, 0.07, 10), gold));
      for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; crown.add(mesh(cone(0.025, 0.07, 4), gold, { p: [Math.sin(a) * 0.09, 0.065, Math.cos(a) * 0.09] })); }

      addLegs([[-0.17, 0.2], [0.17, 0.2], [-0.17, -0.22], [0.17, -0.22]], 0.26, 0.22, 0.065, fur, white);
      tail.position.set(0, 0.42, -0.38);
      tail.add(mesh(cone(0.04, 0.12, 6), fur, { p: [0, 0.03, -0.04], r: [-0.8, 0, 0] }));
    } else {
      const fur = lambert(0xB07A45), ear = lambert(0x6E4527);

      inner.add(mesh(box(0.2, 0.14, 0.2), lambert(0xE3C49E), { p: [0, 0.55, 0.6] }), mesh(SPH, dark, { p: [0, 0.6, 0.71], s: 0.045 }));
      eyes(0.09, 0.69, 0.58, 0.032);
      inner.add(mesh(box(0.06, 0.24, 0.14), ear, { p: [-0.22, 0.6, 0.36], r: [0, 0, 0.25] }), mesh(box(0.06, 0.24, 0.14), ear, { p: [0.22, 0.6, 0.36], r: [0, 0, -0.25] }));
      addLegs([[-0.14, 0.22], [0.14, 0.22], [-0.14, -0.22], [0.14, -0.22]], 0.3, 0.26, 0.05, fur, ear);
      tail.position.set(0, 0.52, -0.38);

    }
    inner.add(tail);
    shadows(g); outline(g);
    const mats = new Set();
    inner.traverse(o => { if (o.isMesh && o.material.isMeshToonMaterial) mats.add(o.material); });
    return { g, inner, legs, wings, tail, mats: [...mats] };
  }

  const hbBgGeo = new THREE.PlaneGeometry(0.64, 0.1);
  const hbFgGeo = new THREE.PlaneGeometry(0.6, 0.06); hbFgGeo.translate(0.3, 0, 0);
  const hbBgMat = shared(new THREE.MeshBasicMaterial({ color: 0x2B2536, depthTest: false }));
  // Michka: a blue-grey Chartreux with copper eyes, no cushion, perched on the chimney and facing the path.
  michka = makeCat({ color: 0x8E9AAF, pts: 0x6F7B91, bib: 0xDCE3EC, eye: 0xF2A541, size: 0.6 });
  michka.g.position.set(0.35, 1.965, -0.6); michka.g.rotation.y = -Math.PI / 2; house.add(michka.g);
  michka.hop = 0; michka.blink = 2; michka.blinkT = 0;
  function makeHealthBar() {
    const group = new THREE.Group();
    const bg = new THREE.Mesh(hbBgGeo, hbBgMat);
    const fg = new THREE.Mesh(hbFgGeo, new THREE.MeshBasicMaterial({ color: 0x7BD389, depthTest: false }));
    fg.position.set(-0.3, 0, 0.001);
    bg.renderOrder = 10; fg.renderOrder = 11;

  }

  // ---------- Sound ----------
  // A tiny WebAudio synth: every sound is built from oscillators and a noise buffer, so there are no files to load.
  // The context is created on the first user gesture (browsers keep audio locked until then).
  let muted = false;
  try { muted = localStorage.getItem('nine-lives-mute') === '1'; } catch (e) {}
  let actx = null, master = null, noiseBuf = null;
  const lastPlay = {};
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.3; master.connect(actx.destination);

  };
  // A mini-map of a garden, drawn from its real path, bushes and house
  function mapThumb(id) {
    const M = MAPS[id];
    const pts = M.path.map(([c, r]) => `${c + 0.5},${r + 0.5}`).join(' ');
    const bushes = M.bushes.map(([c, r]) => `<circle cx="${c + 0.5}" cy="${r + 0.5}" r=".4" fill="#5E8C43"/>`).join('');
    return `<svg class="thumb" viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="10" fill="#9BC36F"/>
      <polyline points="${pts}" fill="none" stroke="#E6C48C" stroke-width=".95" stroke-linecap="square"/>${bushes}
      <rect x="14.1" y="4.1" width="1.8" height="2.8" rx=".2" fill="#C8553D" stroke="${INK}" stroke-width=".18"/>
      <rect x="14.1" y="5.2" width=".35" height=".6" fill="${INK}"/></svg>`;
  }
  document.querySelectorAll('.ico-fish').forEach(el => el.outerHTML = ART.fish);
  document.querySelectorAll('.ico-cam').forEach(el => el.outerHTML = ART.cam);

  // ---------- UI ----------
  const tray = $('tray');
  const hex = n => '#' + n.toString(16).padStart(6, '0');
  Object.keys(TYPES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'card-' + id; b.dataset.type = id;
    b.addEventListener('click', () => setPlacing(placing === id ? null : id));
    tray.appendChild(b);
  });
  function renderTray() {
    Object.entries(TYPES).forEach(([id, T]) => {
      $('card-' + id).innerHTML = `<i class="face" style="--c:${hex(T.color)};--e:${hex(T.pts)}"><i></i></i>
        <span class="name">${catName(id)}</span>
        <span class="meta">${ART.fish}${T.cost}</span>
        <span class="role">${L('role_' + id)}</span>
        <span class="kbd">${T.key}</span>`;
    });
  }

  // Best star rating per map, kept in this browser when storage is available.
  let best = {};
  try { best = JSON.parse(localStorage.getItem('nine-lives-best')) || {}; } catch (e) {}
  const starsFor = (l, max) => l >= max ? 3 : l >= max / 2 ? 2 : 1;
  const starsHTML = s => [1, 2, 3].map(i => ART.star(i <= s)).join('');

  // The overlay is the title screen before the first game and the result after each one.
  let ending = null; // null, or { won, lives, max, wave, stars }
  function renderOverlay() {
    const e = ending;
    $('ovTitle').innerHTML = !e ? L('titleHTML') : e.won ? L('wonTitle') : L('lostTitle');
    $('ovTag').textContent = !e ? L('tagline') : e.won ? L('wonTag') : L('lostTag');
    $('ovText').textContent = !e ? L('intro') : e.won ? L('wonText', MAX_WAVE, e.lives, e.max) : L('lostText', e.wave);
    $('ovStars').hidden = !e?.won;
    if (e?.won) $('ovStars').innerHTML = starsHTML(e.stars);
    $('ovBtn').innerHTML = ART.paw + `<span>${e ? L('again') : L('start')}</span>`;
    // Map cards: a mini-map, the name and the record. Picking one sets up a fresh board behind the overlay.
    const maps = $('mapPick'); maps.innerHTML = '';
    Object.keys(MAPS).forEach(id => {
      const b = document.createElement('button');
      b.className = 'map-card' + (id === mapId ? ' on' : '');
      b.setAttribute('aria-pressed', id === mapId);
      b.title = L('starsRule');
      const rec = best[id] || 0;
      b.innerHTML = mapThumb(id) + `<span class="row"><span>${L('map_' + id)}</span>${rec ? `<span class="stars small">${starsHTML(rec)}</span>` : `<span class="none">${L('noRecord')}</span>`}</span>`;
      b.addEventListener('click', () => {
        mapId = id; try { localStorage.setItem('nine-lives-map', id); } catch (err) {}
        reset(); renderOverlay(); $('mapPick').querySelector('.on')?.focus();
      });
      maps.appendChild(b);
    });
    // How to play, as keycaps
    $('ovHow').hidden = !!e;
    const keys = [[['1', '5'], 'k_pick', '–'], [[L('kSpace')], 'k_wave'], [['U', 'T', 'X'], 'k_utx'], [['P', 'M'], 'k_pm'],
      [['V'], 'k_view'], [['W', 'A', 'S', 'D'], 'k_pan'], [[L('kEsc')], 'k_cancel']];
    $('keys').innerHTML = keys.map(([ks, k, sep]) => `<dt>${ks.map(x => `<span class="kbd">${x}</span>`).join(sep || '')}</dt><dd>${L(k)}</dd>`).join('')
      + `<dd class="mouse">${L('k_mouse')}</dd>`;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = L('title');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = L(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = L(el.dataset.i18nHtml));
    document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = L(el.dataset.i18nTitle));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', L(el.dataset.i18nAria)));
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

    document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', c.dataset.type === placing));

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('nine-lives-lang', lang); } catch (e) {}
    applyLang(); b.blur();
  }));


  function setPlacing(type) {
    placing = type;
    if (type) select(null);
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', c.dataset.type === type));
    if (!type) { hover.visible = false; if (!selected) rangeGroup.visible = false; }
  }
  function select(t) {
    selected = t;
    $('info').hidden = !t;
    if (!t) { rangeGroup.visible = false; return; }
    const T = TYPES[t.type];
    updateBoosts();
    $('infoName').textContent = catName(t.type);
    // level pips in the same silver/gold as the cat's ring and bell
    $('infoLvl').innerHTML = `<span class="pips">${[1, 2, 3].map(n => `<i class="${n <= t.level ? 'l' + Math.max(2, t.level) : ''}"></i>`).join('')}</span>${L('level', t.level, t.level >= 3)}`;
    $('infoDmg').textContent = T.aura ? '—' : t.dmg + (T.splash ? L('splash') : '');
    $('infoRng').textContent = t.range.toFixed(1);
    $('infoRate').textContent = T.aura ? '—' : (1 / t.rate * (1 + t.boost)).toFixed(1) + (t.boost ? L('boosted', Math.round(t.boost * 100)) : '');
    $('infoExtraWrap').hidden = !T.slow && !T.splash && !T.aura;
    $('infoExtraLbl').textContent = T.slow ? L('slowLbl') : T.aura ? L('purrLbl') : L('splashLbl');
    $('infoExtra').textContent = T.slow ? `−${Math.round((1 - t.slow) * 100)}% · ${t.slowT.toFixed(1)}s`
      : T.aura ? L('purr', Math.round(t.aura * 100)) : T.splash ? t.splash.toFixed(2) : '';
    $('modeBtn').hidden = !!T.aura;
    $('modeBtn').textContent = L('target', L('mode_' + t.mode));
    const cost = upgradeCost(t);
    $('upBtn').textContent = t.level >= 3 ? L('maxed') : L('upgrade', cost);
    $('upBtn').disabled = t.level >= 3 || fish < cost;
    $('sellBtn').textContent = L('sell', sellValue(t));
    showRange(t.g.position, t.range);
  }
  $('upBtn').addEventListener('click', () => selected && upgrade(selected));
  $('modeBtn').addEventListener('click', () => selected && cycleMode(selected));
  $('sellBtn').addEventListener('click', () => selected && sell(selected));
  $('closeBtn').addEventListener('click', () => select(null));

  function updateHUD() {
    // lives as a row of hearts (the number stays for screen readers and tooltips)
    $('lives').textContent = lives;
    $('hearts').innerHTML = Array.from({ length: maxLives }, (_, i) => `<span${i < lives ? '' : ' class="lost"'}>${ART.heart}</span>`).join('');
    $('fish').textContent = fish;
    $('wave').textContent = `${wave}/${MAX_WAVE}`;
    // one pip per wave: cleared, on the path, or still to come
    $('track').innerHTML = Array.from({ length: MAX_WAVE }, (_, i) => {
      const n = i + 1;
      return `<i class="${n <= wave ? (waveLeft[n] ? 'now' : 'done') : ''}"></i>`;
    }).join('');
    const wb = $('waveBtn');
    wb.disabled = !canSend();
    wb.innerHTML = ART.paw + `<span>${wave >= MAX_WAVE || queue.length ? L('incoming', wave)
      : waveActive ? L('callEarly', wave + 1, earlyBonus(wave + 1)) : L('sendWave', wave + 1)}</span>`;
    // Preview of the next wave: a little head and a count per kind
    const nx = wave < MAX_WAVE ? waveMix(wave + 1) : null;
    $('nextStat').hidden = !nx;
    if (nx) $('nextList').innerHTML = Object.entries(nx).filter(([, n]) => n).map(([k, n]) => `<span class="chip">${FOE[k]}${n}</span>`).join('');
    Object.entries(TYPES).forEach(([id, T]) => $('card-' + id).classList.toggle('poor', fish < T.cost));
    if (selected) select(selected);
  }

  let toastTimer;
  function toast(msg, long = false) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show'); el.classList.toggle('long', long);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), long ? 4200 : 1800);
  }

  function endGame(won) {
    over = true; waveActive = false; setPlacing(null); select(null); setPaused(false);
    ending = { won, lives, max: maxLives, wave, stars: won ? starsFor(lives, maxLives) : 0 };
    if (won) {
      const key = mapId;
      if (ending.stars > (best[key] || 0)) { best[key] = ending.stars; try { localStorage.setItem('nine-lives-best', JSON.stringify(best)); } catch (e) {} }
      towers.forEach(t => t.cheer = 1e9); // a victory dance behind the result sheet
    }
    sfx(won ? 'win' : 'lose');
    renderOverlay();
    $('overlay').hidden = false;
  }
  $('ovBtn').addEventListener('click', () => {
    $('overlay').hidden = true; $('ovBtn').blur();
    audio(); // unlock sound on this first gesture
    if (started) reset();
    started = true;
    setView('overview'); // the title screen's slow turn ends here
  });
  $('waveBtn').addEventListener('click', sendWave);
  const renderSpeed = () => $('speedBtn').textContent = speed + '×';
  $('speedBtn').addEventListener('click', () => {
    speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; renderSpeed();
    try { localStorage.setItem('nine-lives-speed', speed); } catch (e) {}
  });

  function setPaused(p) {
    userPaused = p && !over;
    $('pausedTag').hidden = !userPaused;
    $('pauseBtn').innerHTML = userPaused ? ART.play : ART.pause;
  }
  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('nine-lives-mute', m ? '1' : '0'); } catch (e) {}
    $('muteBtn').innerHTML = m ? ART.mute : ART.sound;
  }
  $('pauseBtn').addEventListener('click', () => { setPaused(!userPaused); $('pauseBtn').blur(); });
  $('muteBtn').addEventListener('click', () => { setMuted(!muted); $('muteBtn').blur(); });
  // Leaving the tab mid-game pauses it
  document.addEventListener('visibilitychange', () => { if (document.hidden && started && !over && $('overlay').hidden) setPaused(true); });

  // W/A/S/D, Z/Q/S/D (AZERTY) and arrow keys pan the camera (applied each frame in the loop)
  const PAN_KEYS = { w: 'up', z: 'up', a: 'left', q: 'left', s: 'down', d: 'right', arrowup: 'up', arrowleft: 'left', arrowdown: 'down', arrowright: 'right' };
  const panHeld = new Set();
  window.addEventListener('keyup', e => { panHeld.delete(PAN_KEYS[e.key.toLowerCase()]); });
  window.addEventListener('blur', () => panHeld.clear());

  window.addEventListener('keydown', e => {
    if (!$('overlay').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const pan = PAN_KEYS[k];
    if (pan) { e.preventDefault(); panHeld.add(pan); return; }
    const type = Object.keys(TYPES).find(id => TYPES[id].key === e.key);
    if (type) setPlacing(placing === type ? null : type);
    else if (k === 'escape') { setPlacing(null); select(null); }
    else if (e.code === 'Space' || k === ' ') { e.preventDefault(); document.activeElement?.blur?.(); sendWave(); }
    else if (k === 'u' && selected) upgrade(selected);
    else if (k === 't' && selected) cycleMode(selected);
    else if (k === 'x' && selected) sell(selected);
    else if (k === 'p') setPaused(!userPaused);
    else if (k === 'm') setMuted(!muted);
    else if (k === 'v') setView(nextView());
  });

  // ---------- Picking ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  function tileAt(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(ground, hit)) return null;
    const c = Math.floor(hit.x + COLS / 2), r = Math.floor(hit.z + ROWS / 2);
    return inGrid(c, r) ? { c, r } : null;
  }
  // ---------- Camera ----------
  // Orbit around a ground target. theta: heading, phi: angle from straight down, zoom: multiple of the fit distance.
  const VIEWS = {
    overview: { theta: 0,     phi: 0.64, zoom: 1,    tx: 0,   tz: 0.4 },
    corner:   { theta: -0.75, phi: 0.86, zoom: 0.86, tx: 0.4, tz: 0.4 },
    top:      { theta: 0,     phi: 0.02, zoom: 1.08, tx: 0,   tz: 0.2 },
    low:      { theta: 0.4,   phi: 1.2,  zoom: 0.6,  tx: 1.2, tz: 0.8 },
  };
  const VIEW_ORDER = Object.keys(VIEWS);
  // The title screen starts pulled back and slowly turns (see the loop) until the first game begins.
  const TITLE_VIEW = { theta: -0.35, phi: 0.8, zoom: 1.3, tx: 0, tz: 0.4 };
  const cam = { ...TITLE_VIEW }, want = { ...TITLE_VIEW };
  let baseDist = 16, baseTheta = 0, viewName = 'overview';
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function applyCamera() {
    const th = cam.theta + baseTheta, r = baseDist * cam.zoom;
    target.set(cam.tx, 0, cam.tz);
    camera.position.set(target.x + r * Math.sin(cam.phi) * Math.sin(th), r * Math.cos(cam.phi), target.z + r * Math.sin(cam.phi) * Math.cos(th));
    camera.lookAt(target);
  }
  // One camera button cycles through the preset views; its label names the current one ('Free' once dragged).
  const viewLabel = name => name ? L('view' + name[0].toUpperCase() + name.slice(1)) : L('viewFree');
  function markView(name) {
    viewName = name;
    $('camLbl').textContent = viewLabel(name);
  }
  const nextView = () => VIEW_ORDER[(VIEW_ORDER.indexOf(viewName) + 1) % VIEW_ORDER.length];
  function setView(name) {
    const v = VIEWS[name];
    Object.assign(want, v);
    want.theta = v.theta + Math.PI * 2 * Math.round((cam.theta - v.theta) / (Math.PI * 2)); // turn the short way round
    markView(name);
  }
  $('camBtn').addEventListener('click', () => { setView(nextView()); $('camBtn').blur(); });

  // Drag orbits, right-drag (or Shift+drag) pans, wheel zooms. A press that moves under 6px is still a click.
  const canvas = renderer.domElement;
  let drag = null, noClickUntil = 0, noMenuUntil = 0;
  canvas.addEventListener('pointerdown', ev => {
    drag = { x: ev.clientX, y: ev.clientY, lx: ev.clientX, ly: ev.clientY, pan: ev.button === 2 || ev.shiftKey, moved: false };
    canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener('pointerup', ev => {
    if (drag?.moved) { noClickUntil = performance.now() + 80; if (drag.pan) noMenuUntil = performance.now() + 400; }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    want.zoom = clamp(want.zoom * Math.exp(ev.deltaY * 0.0012), 0.35, 1.6);
    markView(null);
  }, { passive: false });
  function dragCamera(ev) {
    const dx = ev.clientX - drag.lx, dy = ev.clientY - drag.ly;
    drag.lx = ev.clientX; drag.ly = ev.clientY;
    if (!drag.moved) {
      if (Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 6) return;
      drag.moved = true; hover.visible = false; markView(null);
    }
    if (drag.pan) {
      const th = cam.theta + baseTheta, s = baseDist * cam.zoom * 0.0016;
      want.tx = clamp(want.tx - Math.cos(th) * dx * s - Math.sin(th) * dy * s, -COLS / 2, COLS / 2);
      want.tz = clamp(want.tz + Math.sin(th) * dx * s - Math.cos(th) * dy * s, -ROWS / 2, ROWS / 2);
    } else {
      want.theta -= dx * 0.008;
      want.phi = clamp(want.phi - dy * 0.006, 0.02, 1.35);
    }
    Object.assign(cam, want); // follow the pointer directly, no easing lag
  }

  canvas.addEventListener('pointermove', ev => {
    if (drag) { dragCamera(ev); if (drag.moved) return; }
    if (!placing || ev.pointerType === 'touch') return;
    const t = tileAt(ev);
    if (!t) { hover.visible = false; rangeGroup.visible = false; return; }
    const ok = grid[t.r][t.c] === 'grass' && fish >= TYPES[placing].cost;
    hover.visible = true; hover.position.copy(toWorld(t.c, t.r, 0.02));
    hover.material.color.set(ok ? 0xFFF4E2 : 0xC8553D);
    showRange(hover.position, TYPES[placing].range);
  });
  canvas.addEventListener('click', ev => {
    if (over || performance.now() < noClickUntil) return;
    const t = tileAt(ev);
    if (!t) { setPlacing(null); select(null); return; }
    const cell = grid[t.r][t.c];
    if (typeof cell === 'object') { setPlacing(null); select(cell); return; }
    if (!placing) { select(null); return; }
    if (cell !== 'grass') { sfx('nope'); return toast(cell === 'path' ? L('noDirt') : L('taken')); }
    const T = TYPES[placing];
    if (fish < T.cost) { sfx('nope'); return toast(L('tooPoor', catName(placing), T.cost)); }
    placeTower(placing, t.c, t.r);
    if (fish < T.cost) setPlacing(null);
  });
  canvas.addEventListener('contextmenu', ev => {
    ev.preventDefault();
    if (performance.now() < noMenuUntil) return; // that right-click was a pan
    setPlacing(null); select(null);
  });

  // ---------- Layout ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight, aspect = w / h;
    renderer.setSize(w, h); camera.aspect = aspect;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    // fit distance for the overview; portrait turns the map so it runs top-to-bottom with the house at the bottom
    if (aspect >= 1) { baseTheta = 0; baseDist = Math.max(9.2 / (t * aspect), 6.4 / t); }
    else { baseTheta = Math.PI / 2; baseDist = Math.max(5.9 / (t * aspect), 8.6 / t); }
    camera.updateProjectionMatrix();
    applyCamera();
  }
  window.addEventListener('resize', resize);

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  const hurtColor = new THREE.Color(0xC8553D);
  let time = 0, frameShift = 1;
  renderer.setAnimationLoop(() => {
    const raw = Math.min(clock.getDelta(), 0.05);
    const overlayUp = !$('overlay').hidden;
    const paused = overlayUp || userPaused;
    const dt = paused ? 0 : raw * speed;
    time += raw;

    // keyboard pan, relative to the camera heading (still works while paused, to look around)
    if (panHeld.size && !overlayUp) {
      const fx = (panHeld.has('right') ? 1 : 0) - (panHeld.has('left') ? 1 : 0);
      const fy = (panHeld.has('up') ? 1 : 0) - (panHeld.has('down') ? 1 : 0);
      if (fx || fy) {
        const th = cam.theta + baseTheta, len = Math.hypot(fx, fy), s = raw * 9 * cam.zoom / len;
        want.tx = clamp(want.tx + (Math.cos(th) * fx - Math.sin(th) * fy) * s, -COLS / 2, COLS / 2);
        want.tz = clamp(want.tz + (-Math.sin(th) * fx - Math.cos(th) * fy) * s, -ROWS / 2, ROWS / 2);
        if (viewName) markView(null);
      }
    }

    // title screen: the garden turns slowly behind the card
    if (overlayUp && !started) want.theta += raw * 0.07;
    // ease the camera toward the chosen view
    const ck = 1 - Math.exp(-raw * 7);
    for (const k in want) cam[k] += (want[k] - cam[k]) * ck;
    applyCamera();
    // while the title/result card is up on a wide screen, frame the garden to the right of it
    frameShift += ((overlayUp && innerWidth > 900 ? 1 : 0) - frameShift) * (1 - Math.exp(-raw * 4));
    if (frameShift > 0.002) { const w = stage.clientWidth, h = stage.clientHeight; camera.setViewOffset(w, h, -frameShift * w * 0.16, 0, w, h); }
    else if (camera.view?.enabled) camera.clearViewOffset();

    // spawn
    if (waveActive && queue.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { const n = queue.shift(); spawn(n.kind, n.w); spawnTimer = n.gap; if (!queue.length) updateHUD(); }
    }

    // enemies
    for (const e of enemies) {
      if (e.dead) continue;
      if (e.slowT > 0) e.slowT -= dt;
      e.clock += dt;
      const k = pace(e);
      let move = e.speed * k * dt;
      while (move > 0 && e.seg < pathPts.length) {
        const tgt = pathPts[e.seg], dx = tgt.x - e.pos.x, dz = tgt.z - e.pos.z, L = Math.hypot(dx, dz);
        if (L > 0.001) e.mesh.rotation.y = Math.atan2(dx, dz);
        if (L <= move) { e.pos.x = tgt.x; e.pos.z = tgt.z; move -= L; e.dist += L; e.seg++; }
        else { e.pos.x += dx / L * move; e.pos.z += dz / L * move; e.dist += move; move = 0; }
      }
      if (e.seg >= pathPts.length) { killEnemy(e, true); continue; }
      // walk cycle: legs swing in diagonal pairs, body bobs twice per stride and rolls side to side
      e.walk += dt * e.speed * k * 11;
      const { inner, legs, wings, tail } = e.rig;
      legs.forEach(l => l.pivot.rotation.x = Math.sin(e.walk + l.phase) * 0.65);
      inner.position.y = Math.abs(Math.cos(e.walk)) * 0.05;
      inner.rotation.z = Math.sin(e.walk) * 0.07;
      tail.rotation.y = Math.sin(e.walk * 0.5) * 0.5;
      if (e.dash) {
        // squirrel: big bounding hops while dashing, then a frozen pose with a nervous tail flick
        inner.position.y = dashing(e) ? Math.abs(Math.sin(e.walk * 0.5)) * 0.16 : 0;
        if (!dashing(e)) tail.rotation.y = Math.sin(time * 30) * 0.12;
      }
      if (wings.length) {
        // pigeon: flapping, bobbing gently in the air
        wings.forEach(w => w.pivot.rotation.z = w.side * (Math.sin(time * 16 + e.walk) * 0.6 + 0.15));
        inner.position.y = Math.sin(time * 4 + e.walk) * 0.05;
        inner.rotation.z = 0;
      }
      // hit reaction: white flash, squash, knockback against the direction of travel
      e.flash = Math.max(0, e.flash - raw);
      setFlash(e, e.flash > 0 ? 0.85 : 0);
      const hq = e.flash / 0.12;
      inner.scale.set(1 + 0.18 * hq, 1 - 0.22 * hq, 1 + 0.18 * hq);
      e.kb *= Math.exp(-raw * 10);
      const hd = e.mesh.rotation.y;
      e.mesh.position.set(e.pos.x - Math.sin(hd) * e.kb, e.fly, e.pos.z - Math.cos(hd) * e.kb);
      // pop in at spawn
      e.age += raw;
      e.mesh.scale.setScalar(e.size * Math.max(0.001, easeOutBack(Math.min(1, e.age / 0.3))));
      const hb = e.hb;
      hb.group.visible = e.hp < e.max;
      hb.group.position.set(e.pos.x, e.hbY, e.pos.z);
      hb.group.quaternion.copy(camera.quaternion);
      hb.fg.scale.x = Math.max(0.001, e.hp / e.max);
      hb.fg.material.color.set(e.slowT > 0 ? 0xE86A92 : e.hp / e.max > 0.4 ? 0x7BD389 : 0xF2A541);
    }
    enemies = enemies.filter(e => !e.dead);

    // towers
    updateBoosts();
    for (const t of towers) {
      const T = TYPES[t.type];
      // drop-in from the sky, bounce on the cushion, dust ring on landing
      let dropY = 0;
      if (t.drop > 0) {
        t.drop -= raw;
        dropY = (1 - easeOutBounce(Math.min(1, 1 - t.drop / DROP_TIME))) * 3;
        if (t.drop <= 0) { ring(t.g.position, 0xE6C48C, 0.95, 0.4); burst(t.g.position, 0xD9B77E, 6, 0.05); sfx('land'); }
      }
      // purring speeds up the cooldown
      t.cd -= dt * (1 + t.boost);
      const best = t.drop <= 0 ? pickTarget(t) : null;
      if (best) {
        const want = Math.atan2(best.pos.x - t.g.position.x, best.pos.z - t.g.position.z);
        let turn = want - t.g.rotation.y; turn = Math.atan2(Math.sin(turn), Math.cos(turn));
        t.g.rotation.y += turn * Math.min(1, dt * 12);
        if (t.cd <= 0) { fire(t, best); t.cd = t.rate; }
      }
      // the Persian sends out a soft pink ripple while it's purring for someone
      if (T.aura && !paused && t.drop <= 0) {
        t.pulse -= raw;
        if (t.pulse <= 0) {
          t.pulse = 2.4;
          if (towers.some(o => o.boost && !o.aura && (o.g.position.x - t.g.position.x) ** 2 + (o.g.position.z - t.g.position.z) ** 2 <= t.range * t.range)) ring(t.g.position, 0xE8A0B0, t.range, 0.9);
        }
      }
      // attack: one front paw winds up then strikes (melee) or throws; body stretches and lunges, tail flicks.
      // Runs on game time so the swing keeps pace with the 2×/3× speed setting.
      t.atk = Math.max(0, t.atk - dt);
      const p = t.atk > 0 ? 1 - t.atk / ATK_TIME : 1;
      if (t.pending && p >= HIT_AT) release(t);
      const st = t.atk > 0 ? Math.sin(p * Math.PI) * (1 - 0.4 * p) : 0;
      // a little celebration hop with both paws up after a wave is cleared
      if (t.cheer > 0) t.cheer -= raw;
      const cheering = t.cheer > 0 && t.atk <= 0 && t.drop <= 0 && !best;
      const hopY = cheering ? Math.abs(Math.sin((time + t.seed) * 7)) * 0.18 : 0;
      const size = T.size * (1 + 0.12 * (t.level - 1));
      const breathe = Math.sin(time * (T.aura ? 1.4 : 2.2) + t.seed) * (T.aura ? 0.04 : 0.025);
      const stretch = T.melee ? 0.12 : 0.28;
      t.body.scale.set(size * (1 - 0.1 * st), size * (1 + stretch * st + breathe), size * (1 - 0.1 * st));
      t.body.rotation.x = (T.melee ? 0.55 : 0.3) * st;
      t.body.position.set(0, 0.12 + 0.08 * st + dropY + hopY, (T.melee ? 0.38 : 0.05) * st);
      const up = T.melee ? 2.4 : 2.8, hit = T.melee ? 0.9 : 1.3;
      t.arms.forEach((arm, i) => {
        if (cheering) { arm.rotation.x = -2.3 + Math.sin(time * 10 + t.seed + i) * 0.25; arm.rotation.z = (i ? -1 : 1) * 0.2; return; }
        arm.rotation.x = t.atk > 0 && i === t.arm ? pawSwing(p, up, hit) : 0;
        arm.rotation.z = t.atk > 0 && i === t.arm ? (i ? -1 : 1) * 0.25 * st : 0; // swipe slightly across the body
      });
      t.wag += raw * (best || cheering ? 7 : 2.2);
      t.tail.forEach((seg, i) => {
        seg.rotation.z = Math.sin(t.wag - i * 0.7) * (0.12 + i * 0.03);
        seg.rotation.x = (i === 0 ? -1.45 - 0.5 * st : 0.32 + 0.1 * st);
      });
      // head: idle tilt when bored, focused when hunting
      const tilt = best ? 0 : Math.sin(time * 0.7 + t.seed) * 0.16;
      t.head.rotation.z += (tilt - t.head.rotation.z) * Math.min(1, raw * 6);
      t.head.rotation.x += ((best ? 0.12 : 0) - t.head.rotation.x) * Math.min(1, raw * 6);
      // blinks and ear twitches on their own random timers; the Persian keeps its eyes half shut, purring
      t.blink -= raw;
      if (t.blink <= 0) { t.blinkT = 0.13; t.blink = 2 + Math.random() * 4; }
      t.blinkT = Math.max(0, t.blinkT - raw);
      t.eyes.forEach(eye => eye.scale.y = t.blinkT > 0 ? 0.12 : T.aura && !cheering ? 0.45 : 1);
      t.earT -= raw;
      if (t.earT <= 0) { t.earFlick = 0.25; t.earSide = Math.random() < 0.5 ? 0 : 1; t.earT = 1.5 + Math.random() * 4; }
      t.earFlick = Math.max(0, t.earFlick - raw);
      t.ears.forEach((ear, i) => ear.rotation.x = i === t.earSide ? -Math.sin((t.earFlick / 0.25) * Math.PI * 2) * 0.5 : 0);
    }

    // projectiles (lobbed on a small arc; fliers are hit in the air)
    for (const s of shots) {
      if (!s.target.dead) { s.aim.copy(s.target.pos); s.aimY = 0.3 + s.target.fly; }
      const total = Math.max(0.2, s.start.distanceTo(s.aim));
      s.t += (s.speed * dt) / total;
      const k = Math.min(1, s.t);
      s.mesh.position.set(
        s.start.x + (s.aim.x - s.start.x) * k,
        s.start.y + (s.aimY - s.start.y) * k + Math.sin(k * Math.PI) * s.arc,
        s.start.z + (s.aim.z - s.start.z) * k);
      s.mesh.rotation.x += dt * 10;
      if (k >= 1) { impact(s); scene.remove(s.mesh); s.done = true; }
    }
    shots = shots.filter(s => !s.done);

    // particles
    for (const p of puffs) {
      p.life -= raw;
      const k = 1 - p.life / p.max;
      if (p.cloud) {
        p.v.multiplyScalar(Math.exp(-raw * 4));
        p.mesh.scale.setScalar(p.size * (1 + 1.3 * k));
        p.mesh.material.opacity = Math.max(0, 1 - k * k);
      } else {
        p.v.y -= 9 * raw;
        p.mesh.scale.setScalar(Math.max(0.001, p.size * (1 - k)));
      }
      p.mesh.position.addScaledVector(p.v, raw);
      if (p.life <= 0) {
        scene.remove(p.mesh); p.done = true;
        if (p.cloud && --p.mesh.material.userData.left <= 0) p.mesh.material.dispose();
      }
    }
    puffs = puffs.filter(p => !p.done);

    for (const r of rings) {
      r.life -= raw;
      const k = 1 - r.life / r.max;
      r.mesh.scale.setScalar(r.radius * (0.3 + 0.7 * Math.sqrt(k)));
      r.mesh.material.opacity = 0.9 * (1 - k);
      if (r.life <= 0) { drop(r.mesh); r.done = true; }
    }
    rings = rings.filter(r => !r.done);

    for (const f of fx) {
      f.life -= raw;
      f.update(Math.min(1, 1 - f.life / f.max));
      if (f.life <= 0) { drop(f.mesh); f.done = true; }
    }
    fx = fx.filter(f => !f.done);

    // defeated invaders spin up and shrink away; ones that got in slip through the cat flap
    for (const d of dying) {
      d.t += raw;
      const k = Math.min(1, d.t / DEATH_TIME);
      if (d.reached) {
        d.g.scale.setScalar(d.s0 * (1 - k));
      } else {
        d.g.position.y = d.y0 + Math.sin(k * Math.PI) * 0.45;
        d.g.rotation.y += raw * 16 * d.spin;
        d.g.scale.setScalar(Math.max(0.001, d.s0 * (1 + 0.3 * Math.sin(k * Math.PI * 0.5)) * (1 - k * k)));
      }
      if (k >= 1) { drop(d.g); d.done = true; }
    }
    dying = dying.filter(d => !d.done);

    // house reacts to hits
    if (houseShake > 0) {
      houseShake -= raw;
      house.position.x = hx + Math.sin(time * 60) * 0.05 * (houseShake / 0.4);
      houseWalls.color.setHex(0xE9D8BE).lerp(hurtColor, houseShake / 0.4);
    } else { house.position.x = hx; houseWalls.color.setHex(0xE9D8BE); }

    // Michka on the chimney: calm and blinking, startled when something gets in,
    // frantic (fur up, ears back, eyes wide) when lives run low, and dancing after a win.
    {
      const m = michka;
      const panic = started && !over && lives <= Math.max(2, Math.ceil(maxLives / 3));
      const party = over && ending?.won;
      m.hop = Math.max(0, m.hop - raw);
      const startled = m.hop > 0;
      let y = startled ? Math.sin((m.hop / 0.5) * Math.PI) * 0.22 : 0;
      if (party) y = Math.abs(Math.sin(time * 6)) * 0.16;
      if (panic) y += Math.abs(Math.sin(time * 9)) * 0.04;
      m.body.position.set(panic ? Math.sin(time * 40) * 0.012 : 0, 0.12 + y, 0);
      m.body.scale.set(0.6, 0.6 * (1 + Math.sin(time * 2) * 0.02), 0.6);
      m.head.rotation.y = panic ? Math.sin(time * 5) * 0.35 : Math.sin(time * 0.45) * 0.5;
      m.ears.forEach((ear, i) => ear.rotation.z = (i ? -1 : 1) * (panic || startled ? 1.1 : 0.3));
      m.tail.forEach((seg, i) => {
        seg.children[0].scale.set(panic || startled ? 1.8 : 1, 1, panic || startled ? 1.8 : 1); // bottle-brush tail
        seg.rotation.z = Math.sin(time * (panic ? 14 : 1.8) - i * 0.7) * (0.12 + i * 0.03);
      });
      m.arms.forEach((arm, i) => arm.rotation.x = party ? -2.3 + Math.sin(time * 8 + i * 2) * 0.3 : 0);
      m.blink -= raw;
      if (m.blink <= 0) { m.blinkT = 0.13; m.blink = 2 + Math.random() * 4; }
      m.blinkT = Math.max(0, m.blinkT - raw);
      const eyeS = panic || startled ? 1.35 : 1;
      m.eyes.forEach(eye => eye.scale.set(eyeS, m.blinkT > 0 && !panic ? 0.12 : eyeS, eyeS));
    }

    renderer.render(scene, camera);
  });

  reset();
  renderSpeed(); setPaused(false); setMuted(muted);
  applyLang();
  resize();
})();
</script>
